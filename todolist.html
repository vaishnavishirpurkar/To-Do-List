<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List App</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .todo-container{

            background: rgba(255,255,255,0.08);

            width: 450px;

            padding: 25px;

            border-radius: 20px;

            backdrop-filter: blur(10px);

            border: 1px solid rgba(103,232,249,0.3);

            box-shadow:
            0 0 20px rgba(103,232,249,0.3),
            0 0 40px rgba(103,232,249,0.15);
        }

        h1{

            text-align: center;

            margin-bottom: 20px;

            color: #67e8f9;

            text-shadow: 0 0 10px rgba(103,232,249,0.8);
        }

        .input-section{

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }

        input{

            flex: 1;

            padding: 12px;

            font-size: 16px;

            border: 1px solid rgba(103,232,249,0.3);

            border-radius: 10px;

            outline: none;

            background: rgba(255,255,255,0.08);

            color: white;
        }

        input::placeholder{
            color: #b6f3ff;
        }

        button{

            padding: 12px 15px;

            border: none;

            background: linear-gradient(to right,#06b6d4,#0891b2);

            color: white;

            border-radius: 10px;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
            0 0 10px rgba(6,182,212,0.4);
        }

        button:hover{

            transform: scale(1.05);

            box-shadow:
            0 0 15px rgba(6,182,212,0.8),
            0 0 30px rgba(6,182,212,0.4);
        }

        ul{
            list-style: none;
        }

        li{

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(103,232,249,0.15);

            padding: 12px;

            margin-bottom: 10px;

            border-radius: 10px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: white;

            transition: 0.3s;
        }

        li:hover{

            transform: translateX(5px);

            box-shadow:
            0 0 10px rgba(103,232,249,0.2);
        }

        .completed{

            text-decoration: line-through;

            color: #94a3b8;
        }

        .delete-btn{

            background: linear-gradient(to right,#ef4444,#dc2626);
        }

        .delete-btn:hover{

            box-shadow:
            0 0 15px rgba(239,68,68,0.8),
            0 0 30px rgba(239,68,68,0.4);
        }

        #taskCount{

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

            color: #67e8f9;

            text-shadow: 0 0 8px rgba(103,232,249,0.6);
        }

        @media(max-width: 500px){

            .todo-container{
                width: 90%;
            }

            .input-section{
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="todo-container">

        <h1>📝 To-Do List</h1>

        <div class="input-section">

            <input type="text"
                   id="taskInput"
                   placeholder="Enter Task">

            <button id="addBtn">
                ➕ Add
            </button>

        </div>

        <ul id="taskList"></ul>

        <div id="taskCount">
            Total Tasks: 0
        </div>

    </div>

    <script>

        // SELECT ELEMENTS

        const taskInput =
        document.getElementById("taskInput");

        const addBtn =
        document.getElementById("addBtn");

        const taskList =
        document.getElementById("taskList");

        const taskCount =
        document.getElementById("taskCount");

        // LOAD TASKS FROM LOCAL STORAGE

        window.onload = () => {

            let savedTasks =
            JSON.parse(localStorage.getItem("tasks")) || [];

            savedTasks.forEach(task => {

                createTask(
                    task.text,
                    task.completed
                );

            });

        };

        // EVENT LISTENER

        addBtn.addEventListener("click", () => {

            let taskText =
            taskInput.value.trim();

            if(taskText === ""){

                alert("Please enter a task");

                return;
            }

            createTask(taskText, false);

            saveTasks();

            taskInput.value = "";

        });

        // CREATE TASK FUNCTION

        const createTask = (taskText, completed) => {

            let li =
            document.createElement("li");

            let span =
            document.createElement("span");

            span.innerText = taskText;

            // MARK COMPLETED

            if(completed){

                span.classList.add("completed");
            }

            // COMPLETE TASK ON CLICK

            span.addEventListener("click", () => {

                span.classList.toggle("completed");

                saveTasks();

            });

            // DELETE BUTTON

            let deleteBtn =
            document.createElement("button");

            deleteBtn.innerText = "Delete";

            deleteBtn.classList.add("delete-btn");

            // DELETE TASK

            deleteBtn.addEventListener("click", () => {

                li.remove();

                updateCount();

                saveTasks();

            });

            // APPEND ELEMENTS

            li.appendChild(span);

            li.appendChild(deleteBtn);

            taskList.appendChild(li);

            updateCount();

        };

        // UPDATE TASK COUNT

        const updateCount = () => {

            let totalTasks =
            taskList.children.length;

            taskCount.innerHTML =
            `Total Tasks: ${totalTasks}`;

        };

        // SAVE TASKS IN LOCAL STORAGE

        const saveTasks = () => {

            let tasks = [];

            document
            .querySelectorAll("#taskList li")
            .forEach(li => {

                let taskText =
                li.querySelector("span").innerText;

                let completed =
                li.querySelector("span")
                .classList
                .contains("completed");

                tasks.push({
                    text: taskText,
                    completed: completed
                });

            });

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        };

    </script>

</body>
</html>
